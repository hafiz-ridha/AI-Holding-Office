<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>AI Virtual Holding</title>
  <link rel="icon" href="/img/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/css/app.css">
  <script type="module" src="/js/app.js"></script>
</head>
<body>
  <div id="login-view" class="login" hidden>
    <form id="login-form" class="login-card" autocomplete="on">
      <div class="brand brand-lg"><span class="brand-mark" aria-hidden="true"></span><span>AI Virtual Holding</span></div>
      <p class="muted">Masuk sebagai administrator.</p>
      <label class="field"><span>Username</span><input name="username" autocomplete="username" required maxlength="64"></label>
      <label class="field"><span>Password</span><input name="password" type="password" autocomplete="current-password" required maxlength="256"></label>
      <p id="login-error" class="form-error" role="alert"></p>
      <button class="btn btn-primary btn-block" type="submit">Masuk</button>
    </form>
  </div>

  <div id="app" class="layout" hidden>
    <aside class="sidebar" id="sidebar">
      <div class="brand"><span class="brand-mark" aria-hidden="true"></span><span>AI Virtual Holding</span></div>
      <nav id="nav" aria-label="Menu utama"></nav>
      <div class="sidebar-foot">
        <span id="user-name" class="muted"></span>
        <button id="theme-btn" class="btn btn-ghost btn-sm" type="button" title="Ganti tema">Tema</button>
        <button id="logout-btn" class="btn btn-ghost btn-sm" type="button">Keluar</button>
      </div>
    </aside>
    <div class="main-wrap">
      <header class="topbar">
        <button id="menu-btn" class="btn btn-ghost btn-icon" type="button" aria-label="Buka menu">☰</button>
        <h1 id="page-title">Holding Overview</h1>
        <div class="topbar-right">
          <span id="queue-pill" class="pill"></span>
          <button id="new-task-btn" class="btn btn-primary btn-sm" type="button">+ Tugas</button>
        </div>
      </header>
      <main id="view" class="view" tabindex="-1"></main>
    </div>
    <div id="scrim" class="scrim" hidden></div>
  </div>
  <div id="toasts" class="toasts" aria-live="polite"></div>
</body>
</html>
